// ---- ワールド生成(バイオーム/海/洞窟) ----

function hitPlayer(){const v=new THREE.Vector3();cam.getWorldDirection(v);let best=null;for(const[id,o]of others){const c=o.g.position.clone();c.y+=1;const d=c.sub(cam.position),t=d.dot(v);if(t<0||t>4.5)continue;if(d.addScaledVector(v,-t).length()<.6&&(!best||t<best.t))best={id,t}}return best}
const sel3=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.004,1.004,1.004)),new THREE.LineBasicMaterial({color:0}));scene.add(sel3);
function boom(x,y,z){for(let a=-3;a<=3;a++)for(let b=-3;b<=3;b++)for(let c=-3;c<=3;c++)if(a*a+b*b+c*c<=10&&y+b>0&&getB(x+a,y+b,z+c)&&getB(x+a,y+b,z+c)!=10)setB(x+a,y+b,z+c,0,1);
  const d=Math.hypot(pos.x-x,pos.y-y,pos.z-z);if(d<5)hurt(Math.round((5-d)*3));say('💥 TNT爆発')}
function addItem(id,n=1){if(id==10||id==11)return;cnt[id]=(cnt[id]||0)+n;if(!hot.includes(id)){const i=hot.indexOf(0);if(i>=0)hot[i]=id;else hot[si]=id}renderBar()}
function act(b){if(!ready||mode==2)return;const h=ray();
  if(b==0){const p=hitPlayer();if(p&&(!h||p.t<h.t)){if(mode==1)send({t:'hit',id:p.id});return}if(!h)return;const id=getB(h.x,h.y,h.z);if(id==9){boom(h.x,h.y,h.z);return}setB(h.x,h.y,h.z,0,1);if(mode==1)addItem(id)}
  else if(h){const id=hot[si];if(!id||(mode==1&&!cnt[id]))return;const{px:x,py:y,pz:z}=h;
    if(SOL(id)&&x+1>pos.x-.3&&x<pos.x+.3&&y+1>pos.y&&y<pos.y+1.8&&z+1>pos.z-.3&&z<pos.z+.3)return;setB(x,y,z,id,1);if(mode==1){cnt[id]--;renderBar()}}}
// ---- UI ----
function say(t){const d=document.createElement('div');d.textContent=t;$('log').appendChild(d);while($('log').children.length>8)$('log').firstChild.remove();setTimeout(()=>d.remove(),9000)}
function hearts(){const e=$('hp');e.style.display=mode==1?'flex':'none';let s='';for(let i=0;i<10;i++)s+=`<i class="${hp>=i*2+2?'f':hp==i*2+1?'h':''}">♥</i>`;e.innerHTML=s}
function renderBar(){const b=$('bar');b.innerHTML='';hot.forEach((id,i)=>{const s=document.createElement('div');s.className='sl'+(i==si?' s':'');if(id){s.appendChild(ic(id));if(mode==1){const n=document.createElement('b');n.textContent=cnt[id]||0;s.appendChild(n)}}s.onclick=()=>{si=i;renderBar()};b.appendChild(s)})}
function setMode(m){mode=m;hp=20;fly=m==2;$('gm').textContent='ゲームモード: '+MODES[m];hearts();renderBar();try{localStorage.setItem('mc_mode',m)}catch(e){}}
function toggleInv(){invOpen=!invOpen;$('inv').style.display=invOpen?'block':'none';if(invOpen){document.exitPointerLock();const g=$('ig');g.innerHTML='';for(let id=1;id<=13;id++){if(mode==1&&!cnt[id])continue;const s=document.createElement('div');s.className='sl';s.appendChild(ic(id));if(mode==1){const n=document.createElement('b');n.textContent=cnt[id];s.appendChild(n)}s.onclick=()=>{hot[si]=id;renderBar()};g.appendChild(s)}}else lock()}
function openChat(pre){chatOpen=true;const c=$('ci');c.style.display='block';c.value=pre||'';document.exitPointerLock();setTimeout(()=>c.focus(),0)}
function closeChat(){chatOpen=false;$('ci').style.display='none';$('ci').blur();lock()}
const lock=()=>{if(!TOUCH)cv.requestPointerLock()},locked=()=>document.pointerLockElement==cv,active=()=>locked()||(TOUCH&&playing&&!chatOpen&&!invOpen);
function copyPos(){const t=`${Math.floor(pos.x)} ${Math.floor(pos.y)} ${Math.floor(pos.z)}`;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>prompt('座標',t));say('座標: '+t+'(コピー)')}
function setWeather(w){weather=w;scene.background.setHex(SKY[w=='rain'?1:0]);scene.fog.color.setHex(SKY[w=='rain'?1:0])}
function rel(a,c){return String(a).startsWith('~')?c+(+String(a).slice(1)||0):+a}
function runCmd(line){const a=line.slice(1).trim().split(/\s+/),c=a[0].toLowerCase();
  if(c=='help')say('/tp x y z|名前 /give 名前|id [数] /gamemode c|s|sp /weather clear|rain /seed [新] /coords /kill /heal /clear /op キー');
  else if(c=='tp'){let x,y,z;if(a.length>=4){x=rel(a[1],pos.x);y=rel(a[2],pos.y);z=rel(a[3],pos.z)}else{const o=[...others.values()].find(o=>o.p.name==a[1]);if(!o)return say('使い方: /tp x y z または /tp 名前');x=o.g.position.x;y=o.g.position.y;z=o.g.position.z}
    if([x,y,z].some(isNaN))return say('座標が不正です');pos.set(x,y,z);vel.set(0,0,0);peak=y;say(`TP: ${x|0} ${y|0} ${z|0}`)}
  else if(c=='give'){const id=NM[a[1]]||+a[1];if(!(id>=1&&id<=13))return say('ブロック名: '+Object.keys(NM).join(' '));addItem(id,+a[2]||64);say('GIVE '+(a[1])+' x'+(+a[2]||64))}
  else if(c=='gamemode'||c=='gm'){const m={c:0,creative:0,0:0,s:1,survival:1,1:1,sp:2,spectator:2,2:2}[a[1]];if(m===undefined)return say('/gamemode creative|survival|spectator');setMode(m);say('ゲームモード: '+MODES[m])}
  else if(c=='weather'){if(['clear','rain'].includes(a[1]))send({t:'weather',w:a[1]});else say('/weather clear|rain')}
  else if(c=='seed'){if(a[1])send({t:'newseed',seed:a.slice(1).join(' ')});else say('シード: '+seed)}
  else if(c=='coords'||c=='pos')copyPos();else if(c=='kill'){hp=1;mode==1?hurt(1):say('サバイバルのみ')}else if(c=='heal'){hp=20;hearts()}else if(c=='clear'){for(const k in cnt)delete cnt[k];renderBar()}
  else if(c=='op')send({t:'op',key:a[1]});else say('不明なコマンド: /help')}
$('ci').addEventListener('keydown',e=>{e.stopPropagation();if(e.key=='Enter'){const v=$('ci').value.trim();if(v)v[0]=='/'?runCmd(v):send({t:'chat',text:v});closeChat()}else if(e.key=='Escape')closeChat()});
// ---- 入力 ----
addEventListener('mousemove',e=>{if(!locked())return;yaw-=e.movementX*.0022*sens;pitch=Math.max(-1.55,Math.min(1.55,pitch-e.movementY*.0022*sens))});
addEventListener('keydown',e=>{if(chatOpen)return;keys[e.code]=true;if(!ready)return;
  if(e.code=='KeyF'&&locked()&&mode==0)fly=!fly;if(e.code=='KeyE')toggleInv();if(e.code=='KeyT')openChat(),e.preventDefault();if(e.key=='/'&&locked())openChat('/'),e.preventDefault();if(e.code=='KeyC'&&locked())copyPos();
  const m=/^Digit([1-9])$/.exec(e.code);if(m){si=+m[1]-1;renderBar()}});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('wheel',e=>{si=(si+(e.deltaY>0?1:8))%9;renderBar()});addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('mousedown',e=>{if(locked())act(e.button==2?2:0)});
document.addEventListener('pointerlockchange',()=>{$('menu').style.display=locked()||chatOpen||invOpen?'none':'flex';if(!locked()&&!chatOpen&&!invOpen)show('main')});
function show(id){document.querySelectorAll('.pn').forEach(p=>p.style.display=p.id==id?'block':'none')}show('main');
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
// キャラクリ
const DEF={skin:'#e0b48c',hair:'#4a3020',shirt:'#3aa0d0',pants:'#3b4a9c',style:1},look=Object.assign({},DEF);
try{Object.assign(look,JSON.parse(localStorage.getItem('mc_look')||'{}'));$('name').value=localStorage.getItem('mc_name')||'';mode=+localStorage.getItem('mc_mode')||0}catch(e){}
function drawPV(){const g=$('pv').getContext('2d');g.clearRect(0,0,24,40);const r=(c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};r(look.pants,6,26,5,14);r(look.pants,13,26,5,14);r(look.shirt,6,14,12,12);r(look.skin,2,14,4,12);r(look.skin,18,14,4,12);r(look.skin,6,2,12,12);
  if(look.style){r(look.hair,6,1,12,4);if(look.style==2){r(look.hair,5,2,1,14);r(look.hair,18,2,1,14)}}r('#222',9,8,2,2);r('#222',13,8,2,2)}
['skin','hair','shirt','pants'].forEach(k=>{$('c_'+k).value=look[k];$('c_'+k).oninput=e=>{look[k]=e.target.value;drawPV()}});$('c_style').value=look.style;$('c_style').onchange=e=>{look.style=+e.target.value;drawPV()};drawPV();
// 設定
$('gm').onclick=()=>setMode((mode+1)%3);$('rd').value=RD;$('rdv').textContent=RD;$('rd').oninput=e=>{RD=+e.target.value;$('rdv').textContent=RD;scene.fog.far=RD*16-6};$('se').oninput=e=>sens=e.target.value/10;
$('ap').onclick=()=>{if(!ready)return alert('先にワールドに入ってください');if($('opk').value)send({t:'op',key:$('opk').value});send({t:'newseed',seed:$('nsd').value})};
$('cp').onclick=()=>ready?copyPos():0;$('rl').onclick=()=>location.reload();
// ワールド一覧/参加
async function loadWorlds(){const wl=$('wl');wl.innerHTML='';let l=[];try{l=await(await fetch('/worlds')).json()}catch(e){}if(!l.length)l=[{name:'world',seed:'(新規)',players:0}];l.forEach(w=>{const o=document.createElement('option');o.value=w.name;o.textContent=`${w.name} (シード ${w.seed} / ${w.players}人)`;wl.appendChild(o)});try{wl.value=localStorage.getItem('mc_world')||wl.value}catch(e){}}loadWorlds();
function join(world,sd){try{localStorage.setItem('mc_look',JSON.stringify(look));localStorage.setItem('mc_name',$('name').value);localStorage.setItem('mc_world',world)}catch(e){}
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);ws.onopen=()=>send({t:'join',world,seed:sd,name:$('name').value||'Player',look});ws.onmessage=onMsg;ws.onclose=()=>{ready=false;$('hud').textContent='切断されました。リロードしてください'}}
function begin(){playing=true;$('menu').style.display='none';lock()}
$('play').onclick=()=>{if(ready){send({t:'look',look});begin()}else{join($('wl').value||'world');begin()}};
$('mk').onclick=()=>{if(ready)return;join($('wn').value||'world2',$('wsd').value);begin()};
// ネームタグ/モデル
function label(t){const c=document.createElement('canvas');c.width=256;c.height=48;const g=c.getContext('2d');g.fillStyle='#0007';g.fillRect(0,0,256,48);g.fillStyle='#fff';g.font='32px sans-serif';g.textAlign='center';g.fillText(t,128,36);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));s.scale.set(1.28,.24,1);s.position.y=2.3;s.name='label';return s}
function model(p){const g=new THREE.Group(),L=p.look||DEF,bx=(w,h,d,c,x,y,z)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));m.position.set(x,y,z);g.add(m)};
  bx(.5,.7,.25,L.pants,0,.35,0);bx(.5,.75,.25,L.shirt,0,1.075,0);bx(.2,.7,.25,L.skin,-.35,1.1,0);bx(.2,.7,.25,L.skin,.35,1.1,0);bx(.5,.5,.5,L.skin,0,1.7,0);bx(.1,.08,.02,'#222',-.12,1.72,-.255);bx(.1,.08,.02,'#222',.12,1.72,-.255);
  if(L.style){bx(.54,.14,.54,L.hair,0,1.93,0);if(L.style==2)bx(.54,.5,.1,L.hair,0,1.65,.22)}g.add(label(p.name));return g}
function addP(p){const o=others.get(p.id);if(o)scene.remove(o.g);const g=model(p);scene.add(g);g.position.set(p.x,p.y,p.z);others.set(p.id,{g,p,t:o?o.t:{x:p.x,y:p.y,z:p.z,ry:p.ry||0}})}
function resetWorld(s){seed=s;edits.clear();chunks.clear();for(const m of meshes.values()){scene.remove(m);m.geometry.dispose()}meshes.clear();spawn()}
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
function onMsg(e){const m=JSON.parse(e.data);
  if(m.t=='init'){myId=m.id;seed=m.seed;worldName=m.world;m.edits.forEach(a=>edits.set(a[0]+','+a[1]+','+a[2],a[3]));spawn();setWeather(m.weather);m.players.forEach(addP);ready=true;setMode(mode);$('cs').textContent=`ワールド「${worldName}」 シード: ${seed}`}
  else if(m.t=='join')addP(m);else if(m.t=='pos'){const o=others.get(m.id);if(o)o.t={x:m.x,y:m.y,z:m.z,ry:m.ry}}
  else if(m.t=='look'){const o=others.get(m.id);if(o)addP({...o.p,look:m.look,...o.t})}
  else if(m.t=='set')setB(m.x,m.y,m.z,m.b,0);else if(m.t=='leave'){const o=others.get(m.id);if(o){scene.remove(o.g);others.delete(m.id)}}
  else if(m.t=='chat')say(`<${m.name}> ${m.text}`);else if(m.t=='dmg')hurt(m.n);else if(m.t=='weather'){setWeather(m.w);say(m.w=='rain'?'雨が降り始めた':'天気が回復した')}
  else if(m.t=='world'){resetWorld(m.seed);$('cs').textContent=`ワールド「${worldName}」 シード: ${seed}`;say('ワールドが作り直されました。シード: '+seed)}}
setInterval(()=>{if(ready)send({t:'pos',x:+pos.x.toFixed(2),y:+pos.y.toFixed(2),z:+pos.z.toFixed(2),ry:+yaw.toFixed(2)})},50);
// タッチ
if(TOUCH){$('tc').style.display='block';const js=$('js'),kn=$('kn');let jid=null,jo,lid=null,lp;
  js.addEventListener('touchstart',e=>{const t=e.changedTouches[0];jid=t.identifier;jo=[t.clientX,t.clientY];e.preventDefault()},{passive:false});
  js.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier==jid){let dx=(t.clientX-jo[0])/40,dy=(t.clientY-jo[1])/40;const l=Math.max(1,Math.hypot(dx,dy));dx/=l;dy/=l;jx=dx;jy=-dy;kn.style.transform=`translate(${dx*30}px,${dy*30}px)`}e.preventDefault()},{passive:false});
  js.addEventListener('touchend',()=>{jid=null;jx=jy=0;kn.style.transform=''});
  cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];lid=t.identifier;lp=[t.clientX,t.clientY]});
  cv.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier==lid){yaw-=(t.clientX-lp[0])*.006*sens;pitch=Math.max(-1.55,Math.min(1.55,pitch-(t.clientY-lp[1])*.006*sens));lp=[t.clientX,t.clientY]}});
  $('tj').ontouchstart=e=>{jmp=true;e.preventDefault()};$('tj').ontouchend=()=>jmp=false;$('ts').onclick=()=>{snT=!snT;$('ts').style.background=snT?'#4a8':'#0008'};
  $('td').onclick=()=>act(0);$('tp').onclick=()=>act(2);$('ti').onclick=toggleInv;$('tch').onclick=()=>openChat();$('tm').onclick=()=>{playing=false;$('menu').style.display='flex';show('main')}}
// ---- ループ ----
let last=performance.now(),drops=Array.from({length:140},()=>({x:Math.random(),y:Math.random()}));
(function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.033);last=now;
  if(ready){if(active())move(dt);stream();cam.position.set(pos.x,pos.y+(sneak?1.37:1.62),pos.z);cam.rotation.set(pitch,yaw,0);
    const h=mode==2?null:ray();sel3.visible=!!h;if(h)sel3.position.set(h.x+.5,h.y+.5,h.z+.5);
    for(const o of others.values()){const k=Math.min(1,dt*12);o.g.position.x+=(o.t.x-o.g.position.x)*k;o.g.position.y+=(o.t.y-o.g.position.y)*k;o.g.position.z+=(o.t.z-o.g.position.z)*k;o.g.rotation.y=o.t.ry;
      const lb=o.g.getObjectByName('label'),op=Math.max(0,Math.min(1,1-(o.g.position.distanceTo(cam.position)-8)/32));lb.material.opacity=op;lb.visible=op>.03}
    $('hud').textContent=`${worldName} | ${MODES[mode]} | ${BN[bio(Math.floor(pos.x),Math.floor(pos.z))]} | XYZ ${pos.x.toFixed(1)} ${pos.y.toFixed(1)} ${pos.z.toFixed(1)} | シード ${seed} | ${others.size+1}人${fly?' | 飛行':''}${sneak?' | スニーク':''}`}
  rg.clearRect(0,0,rc.width,rc.height);if(weather=='rain'){rg.strokeStyle='rgba(170,190,255,.55)';rg.beginPath();for(const d of drops){d.y+=dt*1.4;d.x-=dt*.1;if(d.y>1){d.y=0;d.x=Math.random()*1.1}const X=d.x*rc.width,Y=d.y*rc.height;rg.moveTo(X,Y);rg.lineTo(X-3,Y+16)}rg.stroke()}
  renderer.render(scene,cam)})(last);
</script></body></html>
